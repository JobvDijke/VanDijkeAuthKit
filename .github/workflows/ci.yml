name: Swift Package CI

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
      - name: Security scan
        run: sh scripts/security_scan.sh
      - name: Test package
        run: swift test
